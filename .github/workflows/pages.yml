# The root Pages site of boardfarmdevs (vcpe.dev). Pages source: GitHub Actions; the custom domain
# is set in Settings -> Pages (the CNAME file is kept for reference, Actions deploys ignore it).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p dist/site
          cp index.html 404.html .nojekyll dist/site/
          find dist/site -type f | sort
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
